[package]
name = "luminaria"
version = "0.1.0"
description = "A library for writing Wayland compositors: mechanism, no policy"
license = "Apache-2.0 OR BSD-2-Clause"

[dependencies]
luminaria_types = { workspace = true }
luminaria_server = { workspace = true }
luminaria_proto = { workspace = true }
luminaria_wire = { workspace = true }
libdrm_sys = { workspace = true }
luminaria_backend = { workspace = true, optional = true }
luminaria_compose = { workspace = true, optional = true }

[features]
default = ["backend", "vulkan", "nested"]
# The built-in output: DRM/KMS and headless (and nested, below).
backend = ["dep:luminaria_backend"]
# The built-in renderer, on Vulkan.
vulkan = ["dep:luminaria_compose"]
nested = ["backend", "luminaria_backend/nested"]
