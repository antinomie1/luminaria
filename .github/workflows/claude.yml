name: Claude Code

# Mention @claude in an issue, a PR comment, or a review and it picks up the
# thread. Needs an ANTHROPIC_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so it can read CI results on a PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh pr:*),Bash(gh issue:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --system-prompt "This runner has no Wayland/Vulkan/DRM toolchain, so you cannot build or run the tests here: reason from the source and say so rather than claiming you verified anything. Read CLAUDE.md first — its conventions are load-bearing. In particular: fallible operations return Result<T>/Status and never throw across the C boundary; every request slot in a libwayland interface vtable must be filled, because a null slot aborts the process; any retained wl_resource owned by a client needs a destroy listener; C handles are RAII-wrapped and there should be no manual wl_list_remove. Public headers stay free of C headers (wl_resource and friends are forward-declared only)."

# ponytail: no toolchain install step. Adding one (meson, ninja, a C++23 gcc,
# wayland-protocols, vulkan headers, libdrm, libinput, libseat, glslang) would
# let Claude actually run `meson test`; skipped until a review needs it.
