[package]
name = "luminaria_backend"
version = "0.1.0"
description = "Outputs and input devices: DRM/KMS, nested Wayland, headless; seat sessions, libinput and xkb; no GPU"
license = "Apache-2.0 OR BSD-2-Clause"

[dependencies]
luminaria_proto = { workspace = true, optional = true }
libdrm_sys = { workspace = true }
libudev_sys = { workspace = true }
libseat_sys = { workspace = true }
libinput_sys = { workspace = true }
xkbcommon_sys = { workspace = true }
luminaria_types = { workspace = true }
luminaria_wire = { workspace = true, optional = true }

[dev-dependencies]
luminaria_compose = { workspace = true }

[features]
default = ["nested"]
# A window of a parent Wayland compositor as the output (a Wayland client:
# needs the protocol bundles).
nested = ["dep:luminaria_proto", "dep:luminaria_wire"]
