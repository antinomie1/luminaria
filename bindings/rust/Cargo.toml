[package]
name = "luminaria"
version = "0.0.1"
edition = "2024"
description = "Rust bindings for the luminaria Wayland compositor library"
license-file = "../../LICENSE"
links = "luminaria"
build = "build.rs"

[features]
default = []
# Raw VkInstance/VkPhysicalDevice/VkDevice/VkQueue for ash users; see
# docs/api.md §9.4 for what borrowing them obliges the caller to.
raw-vulkan = []
mint = ["dep:mint"]
glam = ["dep:glam"]

[dependencies]
cxx = "1.0"
mint = { version = "0.5", optional = true }
glam = { version = "0.29", optional = true }

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
calloop = "0.14"
# The client half of the protocol tests: real requests over a socketpair.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
