[package]
name = "luminaria"
version = "0.0.1"
edition = "2024"
description = "Rust bindings for the luminaria Wayland compositor library"
license-file = "../../LICENSE"
links = "luminaria"
build = "build.rs"

[features]
# One feature per C++ module (ADR 0008), on by default. Turning one off drops
# its bridge, its C++ shim and its system libraries: with `--no-default-features`
# nothing links Vulkan, libdrm, libinput, libudev, gbm or libseat.
#
#   backend  luminaria.backend   headless, nested, DRM/KMS, libinput, session
#   render   luminaria.render    Vulkan, the CPU compositor, dmabuf/syncobj/screencopy
#   shell    luminaria.shell     Frame, SceneRenderer, Cursor, layer surfaces, direct
#                                scanout, AutoBackend; implies backend + render
#   gpu      the historical name for the whole stack; same build as `shell`
#
# `desktop` is independent of all three: the privileged protocols need no GPU.
# The Rust bridges for the shell layer (Frame, Cursor, SceneRenderer, the scene
# list, the CPU compositor, the headless/nested backends) are all carried by the
# `shell` bridge today, so `backend` and `render` on their own build their C++
# module but expose no extra Rust API yet; that split is the next step.
default = ["gpu", "desktop"]
backend = []
render = []
shell = ["backend", "render"]
gpu = ["shell"]
desktop = []
# fcft + fontconfig + pixman; see src/text.rs and luminaria.text.
text = []
# Raw VkInstance/VkPhysicalDevice/VkDevice/VkQueue for ash users; see
# docs/api.md §9.4 for what borrowing them obliges the caller to.
raw-vulkan = ["gpu"]
mint = ["dep:mint"]
glam = ["dep:glam"]

[dependencies]
cxx = "1.0"
mint = { version = "0.5", optional = true }
glam = { version = "0.29", optional = true }
drm-fourcc = "2.2.0"

[build-dependencies]
cxx-build = "1.0"
pkg-config = "0.3"

[dev-dependencies]
calloop = "0.14"
# The client half of the protocol tests: real requests over a socketpair.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# Tests and examples that only make sense with a module switched on.
[[test]]
name = "test_backend"
required-features = ["backend"]

[[test]]
name = "test_auto_backend"
required-features = ["gpu"]

[[test]]
name = "test_gpu"
required-features = ["gpu"]

[[test]]
name = "test_desktop"
required-features = ["desktop"]

[[test]]
name = "test_desktop_events"
required-features = ["desktop"]

[[test]]
name = "test_session_lock"
required-features = ["desktop"]

[[test]]
name = "test_text_input"
required-features = ["desktop"]

[[test]]
name = "test_teardown"
required-features = ["desktop"]

[[test]]
name = "test_escape_hatches"
required-features = ["gpu"]

[[test]]
name = "test_text"
required-features = ["text"]

[[example]]
name = "minimal"
required-features = ["gpu", "desktop"]

[[example]]
name = "calloop"
required-features = ["gpu"]
